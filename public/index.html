<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plataforma institucional</title>
</head>
<body style="font-family: sans-serif; max-width: 320px; margin: 60px auto;">
  <h2>Iniciar sesión</h2>
  <input id="user" placeholder="Usuario" style="width: 100%; margin-bottom: 8px;">
  <input id="pass" type="password" placeholder="Contraseña" style="width: 100%; margin-bottom: 8px;">
  <button onclick="login()">Entrar</button>
  <p id="msg"></p>

  <script>
    async function login() {
      const msg = document.getElementById("msg");
      msg.textContent = "Validando...";
      const inicio = Date.now();
      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("user").value,
          password: document.getElementById("pass").value
        })
      });
      const data = await res.json();
      const seg = ((Date.now() - inicio) / 1000).toFixed(1);
      msg.textContent = `${data.message} (HTTP ${res.status}, ${seg} s)`;
    }
  </script>
</body>
</html>
